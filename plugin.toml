# maki package manifest. See https://maki.sh/docs/packages/
# A package keeps only what this file names.

min_maki_version = "0.7.1"

# No floor above 0.7.1 is set on purpose: the transcript outline APIs this pane
# needs are still an open pull request upstream (tontinton/maki#1155), not a
# release, so a higher floor would skip the plugin even on a build that carries
# that branch. The README states what is required, and the plugin checks at open
# time.

[permissions]
# The pane draws its tree from maki.ui.transcript_outline(), which returns the
# first line of every jumpable block, so maki guards it with session_read. The
# pane also rebuilds on TurnStart, TurnEnd and ToolDone, and maki counts the
# content fields of an event as conversation content. Without this key it leaves
# those fields out of the event table and says so in the status bar on someone
# else's behalf.
session_read = true
